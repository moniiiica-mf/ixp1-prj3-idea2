<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapped in a Dream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            z-index: 100;
            pointer-events: none;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            transition: opacity 0.5s;
        }

        #instructions.hidden {
            opacity: 0;
        }

        #interaction-prompt {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            z-index: 100;
            pointer-events: none;
            font-size: 16px;
            display: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        #ending-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #ending-text {
            color: #fff;
            font-size: 24px;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
            padding: 20px;
            margin-bottom: 30px;
        }

        #restart-button {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 15px 40px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        #restart-button:hover {
            background: #fff;
            color: #000;
        }

        #intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: eyeOpening 3s;
        }

        @keyframes eyeOpening {
            0% { clip-path: inset(50% 0 50% 0); }
            100% { clip-path: inset(0 0 0 0); }
        }

        #intro-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            margin-bottom: 40px;
            text-align: center;
            max-width: 500px;
            line-height: 1.8;
        }

        #start-button {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: rgba(255, 255, 255, 0.8);
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            animation: breathe 3s infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        #start-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }

        .glitch {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>
    <div id="intro-screen">
        <div id="intro-text">
            Your eyes slowly open...<br>
            But something feels... off.
        </div>
        <button id="start-button">Wake Up</button>
    </div>

    <div id="canvas-container"></div>

    <div id="instructions">
        WASD - Move | Mouse - Look Around | E - Interact<br>
        Click to lock cursor
    </div>

    <div id="interaction-prompt"></div>

    <div id="ending-screen">
        <div id="ending-text"></div>
        <button id="restart-button">Try Again</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js?v=2.0"></script>
</body>
</html>
