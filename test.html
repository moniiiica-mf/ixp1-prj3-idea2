<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Verification Test</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: monospace;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 1px solid #fff;
            z-index: 1000;
            max-width: 400px;
        }
        #status { color: #0f0; margin-bottom: 10px; font-weight: bold; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warning { color: #ff0; }
        #scene-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="info">
        <div id="status">Checking scene...</div>
        <div id="details"></div>
    </div>
    <div id="scene-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { Reflector } from 'three/addons/objects/Reflector.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

        const status = document.getElementById('status');
        const details = document.getElementById('details');

        function log(msg, type = 'success') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = msg;
            details.appendChild(div);
            console.log(msg);
        }

        try {
            log('✓ THREE.js loaded successfully');
            log('✓ PointerLockControls loaded');
            log('✓ Reflector loaded');
            log('✓ GLTFLoader loaded');
            log('✓ RectAreaLightUniformsLib loaded');

            // Create scene
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.FogExp2(0x1a1a1a, 0.05);
            log(`✓ Scene created (bg: #1a1a1a, fog: 0.05)`, 'success');

            RectAreaLightUniformsLib.init();
            log('✓ RectAreaLight initialized');

            // Camera
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 3);
            log('✓ Camera created at (0, 1.6, 3)');

            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('scene-container').appendChild(renderer.domElement);
            log(`✓ Renderer created (exposure: 1.2)`, 'success');

            // Add bright ambient light
            const ambientLight = new THREE.AmbientLight(0x404040, 1.2);
            scene.add(ambientLight);
            log('✓ Ambient light added (intensity: 1.2)');

            // Add bright point light
            const pointLight = new THREE.PointLight(0xdddddd, 3.5, 20);
            pointLight.position.set(0, 4.5, 0);
            scene.add(pointLight);
            log('✓ Ceiling light added (intensity: 3.5)');

            // Add visible test cube
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 1.6, -2);
            scene.add(cube);
            log('✓ RED TEST CUBE added at (0, 1.6, -2)', 'warning');

            // Add floor
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x141414 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            log('✓ Floor added');

            status.textContent = '✓ SCENE LOADED SUCCESSFULLY!';
            status.className = 'success';
            log('');
            log('If you can see a RED CUBE, lighting is working!', 'warning');
            log('Background should be dark gray (#1a1a1a)', 'warning');

            // Render loop
            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();

        } catch (error) {
            status.textContent = '✗ ERROR LOADING SCENE';
            status.className = 'error';
            log(`ERROR: ${error.message}`, 'error');
            log(`Stack: ${error.stack}`, 'error');
            console.error(error);
        }
    </script>
</body>
</html>
